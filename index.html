<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        var methods = ['log', 'info', 'warn', 'error', 'debug'];
        methods.forEach(function(m) {
          var orig = console[m];
          if (!orig) return;
          console[m] = function() {
            var str = '';
            for (var i = 0; i < arguments.length; i++) {
              str += ' ' + String(arguments[i] && (arguments[i].message || arguments[i]));
            }
            if (
              str.indexOf('[vite]') !== -1 ||
              str.indexOf('WebSocket') !== -1 ||
              str.indexOf('websocket') !== -1 ||
              str.indexOf('ws://') !== -1 ||
              str.indexOf('wss://') !== -1
            ) {
              return;
            }
            return orig.apply(console, arguments);
          };
        });

        window.addEventListener('error', function(e) {
          var msg = String((e && (e.message || (e.error && e.error.message))) || '');
          if (
            msg.indexOf('[vite]') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var msg = String((e && e.reason && (e.reason.message || e.reason)) || '');
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('websocket') !== -1 ||
            msg.indexOf('[vite]') !== -1
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <title>Central de Autorizações & POPs Hospitalar</title>
